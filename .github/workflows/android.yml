name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MediaVolumeRecorder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediaVolumeRecorder-apk
          path: MediaVolumeRecorder.apk

      # 푸시할 때마다 릴리스에 APK 를 올립니다.
      # 폰에서 https://github.com/<owner>/<repo>/releases/latest 로 바로 내려받을 수 있습니다.
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('미디어 녹음기 build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: MediaVolumeRecorder.apk
